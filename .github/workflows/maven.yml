name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Run tests
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tariff-jar
        path: backend/target/tariff-0.0.1-SNAPSHOT.jar
        retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test, build]  # Only deploy if both test and build succeed
    if: github.ref == 'refs/heads/main'  # Only deploy main branch

    steps:
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: tariff-jar
        path: ./

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "tariff-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/"

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # Stop existing service
          sudo systemctl stop tariff || true
          
          # Backup old JAR
          mv tariff-0.0.1-SNAPSHOT.jar tariff-backup.jar 2>/dev/null || true
          
          # Move new JAR to correct location
          sudo mv tariff-0.0.1-SNAPSHOT.jar /home/ubuntu/
          sudo chown ubuntu:ubuntu /home/ubuntu/tariff-0.0.1-SNAPSHOT.jar
          
          # Start service
          sudo systemctl start tariff
          
          # Wait for startup
          sleep 30
          
          # Health check
          if curl -f http://localhost:8080/api/status; then
            echo "✅ Deployment successful!"
            sudo systemctl status tariff --no-pager
          else
            echo "❌ Deployment failed - health check failed"
            exit 1
          fi
