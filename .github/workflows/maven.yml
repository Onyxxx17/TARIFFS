on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build package for deployment
      run: |
        cd backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "backend/target/tariff-0.0.1-SNAPSHOT.jar"
        target: "/home/ubuntu/"

    - name: Deploy on EC2
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        script: |
          # Stop existing service
          sudo systemctl stop tariff || true
          
          # Set proper permissions
          sudo chmod +x /home/ubuntu/tariff-0.0.1-SNAPSHOT.jar
          
          # Start service
          sudo systemctl start tariff
          
          # Wait for startup and check status
          sleep 30
          if systemctl is-active --quiet tariff; then
            echo "✅ Service is running successfully!"
            # Basic connectivity test instead of specific endpoint
            if curl -f http://localhost:8080/api/status || curl -f https://localhost:8080/api/hello; then
              echo "✅ Application is responding!"
            else
              echo "⚠️  Service running but application not responding as expected"
            fi
          else
            echo "❌ Service failed to start"
            sudo systemctl status tariff --no-pager
            exit 1
          fi
