spring.application.name=tariff
spring.h2.console.enabled=true

# Database URL using environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver class (optional - auto-detected)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:myVerySecretKeyForTariffApplication123456789}
jwt.expiration=${JWT_EXPIRATION:20}
jwt.issuer=tariff-application

# Refresh Token Configuration
app.jwtRefreshExpirationMs=86400000