# Test configuration
spring.profiles.active=test

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mail configuration for tests (mock values)
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=testpassword

# App configuration for tests
app.base-url=http://localhost:8080

# OAuth2 configuration for tests (mock values)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# JWT configuration for tests
jwt.secret=testSecretKeyForJWTTokenThatIsLongEnoughForHS256Algorithm
jwt.expiration=86400000

# Disable actuator endpoints in tests
management.endpoints.enabled-by-default=false